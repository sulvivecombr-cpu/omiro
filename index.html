<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0d17" />
    <meta
      name="description"
      content="Papeo: conversas aleatórias por vídeo, áudio e texto com pessoas do mundo todo."
    />
    <title>Papeo — Papo aleatório por vídeo</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%237c5cff'/%3E%3Cpath d='M16 22a6 6 0 0 1 6-6h14a6 6 0 0 1 6 6v4l10-6v24l-10-6v4a6 6 0 0 1-6 6H22a6 6 0 0 1-6-6z' fill='white'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --bg: #0b0d17;
        --surface: #141829;
        --surface-2: #1c2138;
        --border: rgba(255, 255, 255, 0.08);
        --text: #eef0ff;
        --muted: #8e94b8;
        --brand: #7c5cff;
        --brand-2: #ff6bb5;
        --ok: #2fd18b;
        --warn: #ffb84d;
        --danger: #ff5c72;
        --radius: 16px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto,
          sans-serif;
        background: radial-gradient(
            1200px 600px at 10% -10%,
            rgba(124, 92, 255, 0.18),
            transparent 60%
          ),
          radial-gradient(
            900px 500px at 100% 0%,
            rgba(255, 107, 181, 0.12),
            transparent 60%
          ),
          var(--bg);
        color: var(--text);
        min-height: 100vh;
        min-height: 100dvh;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
        line-height: 1.45;
      }

      .app {
        max-width: 1320px;
        margin: 0 auto;
        padding: 16px 20px 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-height: 100vh;
        min-height: 100dvh;
      }

      /* ---------- Header ---------- */
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .logo {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--brand), var(--brand-2));
        display: grid;
        place-items: center;
        box-shadow: 0 8px 24px rgba(124, 92, 255, 0.35);
        flex-shrink: 0;
      }

      .logo svg {
        width: 22px;
        height: 22px;
        fill: #fff;
      }

      .brand h1 {
        font-size: 1.35rem;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }

      .brand p {
        font-size: 0.8rem;
        color: var(--muted);
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-radius: 999px;
        background: var(--surface);
        border: 1px solid var(--border);
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--muted);
        max-width: 55%;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .status::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
        flex-shrink: 0;
      }

      .status.connected {
        color: var(--ok);
      }
      .status.connected::before {
        background: var(--ok);
      }
      .status.matching {
        color: var(--warn);
      }
      .status.matching::before {
        background: var(--warn);
        animation: blink 1s ease-in-out infinite;
      }
      .status.matched {
        color: var(--brand);
      }
      .status.matched::before {
        background: var(--brand);
      }
      .status.error {
        color: var(--danger);
      }
      .status.error::before {
        background: var(--danger);
      }

      @keyframes blink {
        50% {
          opacity: 0.3;
        }
      }

      /* ---------- Layout ---------- */
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 360px;
        gap: 16px;
        flex: 1;
        min-height: 0;
      }

      .stage-col {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-width: 0;
      }

      .stage {
        position: relative;
        background: #000;
        border-radius: var(--radius);
        overflow: hidden;
        border: 1px solid var(--border);
        aspect-ratio: 16 / 9;
        max-height: calc(100dvh - 230px);
        min-height: 260px;
        width: 100%;
      }

      .stage video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        background: #000;
      }

      #localVideo {
        transform: scaleX(-1);
      }

      .pip {
        position: absolute;
        right: 14px;
        bottom: 14px;
        width: clamp(110px, 24%, 240px);
        aspect-ratio: 4 / 3;
        border-radius: 12px;
        overflow: hidden;
        border: 2px solid rgba(255, 255, 255, 0.25);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        background: var(--surface-2);
      }

      .tag {
        position: absolute;
        left: 10px;
        top: 10px;
        padding: 4px 10px;
        font-size: 0.72rem;
        font-weight: 600;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(6px);
        color: #fff;
        z-index: 2;
      }

      .pip .tag {
        left: 6px;
        top: 6px;
        font-size: 0.65rem;
        padding: 2px 8px;
      }

      .overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 24px;
        background: linear-gradient(160deg, #141829, #0b0d17);
        color: var(--muted);
        transition: opacity 0.25s ease;
        z-index: 1;
      }

      .overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .overlay h2 {
        color: var(--text);
        font-size: clamp(1.05rem, 2.4vw, 1.5rem);
        margin: 14px 0 6px;
      }

      .overlay p {
        font-size: 0.92rem;
        max-width: 38ch;
        margin: 0 auto;
      }

      .spinner {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 4px solid rgba(255, 255, 255, 0.12);
        border-top-color: var(--brand);
        animation: spin 0.9s linear infinite;
        margin: 0 auto;
        display: none;
      }

      .overlay.searching .spinner {
        display: block;
      }
      .overlay.searching .empty-icon {
        display: none;
      }

      .empty-icon {
        width: 56px;
        height: 56px;
        margin: 0 auto;
        display: block;
        opacity: 0.6;
        fill: var(--muted);
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ---------- Controls ---------- */
      .controls {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 10px;
      }

      button {
        font: inherit;
        font-weight: 600;
        font-size: 0.9rem;
        color: var(--text);
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 12px;
        min-height: 48px;
        padding: 10px 12px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: transform 0.12s ease, filter 0.15s ease, background 0.15s;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      button svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
        flex-shrink: 0;
      }

      button:hover:not(:disabled) {
        filter: brightness(1.15);
      }
      button:active:not(:disabled) {
        transform: scale(0.97);
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 2px;
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--brand), #5a8bff);
        border-color: transparent;
        color: #fff;
      }
      .btn-success {
        background: linear-gradient(135deg, #1fb57a, #2fd18b);
        border-color: transparent;
        color: #04281a;
      }
      .btn-danger {
        background: rgba(255, 92, 114, 0.14);
        border-color: rgba(255, 92, 114, 0.4);
        color: #ff8fa0;
      }

      .hint {
        font-size: 0.8rem;
        color: var(--muted);
        text-align: center;
      }

      /* ---------- Chat ---------- */
      .chat {
        display: flex;
        flex-direction: column;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        min-height: 0;
      }

      .chat-header {
        padding: 14px 16px;
        font-weight: 700;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .chat-header small {
        color: var(--muted);
        font-weight: 500;
        font-size: 0.75rem;
      }

      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-height: 160px;
        overscroll-behavior: contain;
      }

      .chat-empty {
        margin: auto;
        text-align: center;
        color: var(--muted);
        font-size: 0.9rem;
        padding: 16px;
      }

      .message {
        max-width: 85%;
        padding: 9px 12px;
        border-radius: 14px;
        font-size: 0.93rem;
        word-break: break-word;
        overflow-wrap: anywhere;
        animation: pop 0.18s ease;
      }

      .message.sent {
        align-self: flex-end;
        background: linear-gradient(135deg, var(--brand), #5a8bff);
        border-bottom-right-radius: 4px;
      }

      .message.received {
        align-self: flex-start;
        background: var(--surface-2);
        border-bottom-left-radius: 4px;
      }

      .message-time {
        font-size: 0.68rem;
        opacity: 0.65;
        margin-top: 2px;
        text-align: right;
      }

      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }

      .chat-input {
        display: flex;
        gap: 8px;
        padding: 12px;
        border-top: 1px solid var(--border);
      }

      .chat-input input {
        flex: 1;
        min-width: 0;
        font: inherit;
        font-size: 16px; /* evita zoom automático no iOS */
        color: var(--text);
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 0 14px;
        min-height: 48px;
      }

      .chat-input input::placeholder {
        color: var(--muted);
      }
      .chat-input input:disabled {
        opacity: 0.5;
      }

      /* ---------- Info ---------- */
      .info {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 20px;
        font-size: 0.75rem;
        color: var(--muted);
        justify-content: center;
      }

      .info b {
        color: var(--text);
        font-weight: 600;
      }

      .info span.id {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      /* ---------- Toast ---------- */
      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(20px + env(safe-area-inset-bottom));
        transform: translate(-50%, 30px);
        background: var(--surface-2);
        border: 1px solid rgba(255, 92, 114, 0.5);
        color: var(--text);
        padding: 12px 18px;
        border-radius: 12px;
        font-size: 0.9rem;
        max-width: min(92vw, 460px);
        opacity: 0;
        pointer-events: none;
        transition: all 0.25s ease;
        z-index: 50;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      }

      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      /* ---------- Tablet ---------- */
      @media (max-width: 1024px) {
        .layout {
          grid-template-columns: 1fr;
        }
        .stage {
          max-height: 62dvh;
        }
        .chat {
          height: 340px;
        }
        .controls {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      /* ---------- Celular ---------- */
      @media (max-width: 600px) {
        .app {
          padding: 10px 12px 16px;
          gap: 12px;
        }
        .brand p {
          display: none;
        }
        .brand h1 {
          font-size: 1.15rem;
        }
        .logo {
          width: 34px;
          height: 34px;
        }
        .status {
          font-size: 0.78rem;
          padding: 6px 10px;
          max-width: 62%;
        }
        .stage {
          aspect-ratio: 3 / 4;
          max-height: 58dvh;
          min-height: 0;
        }
        .pip {
          width: 30%;
          right: 10px;
          bottom: 10px;
        }
        .controls {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .chat {
          height: 300px;
        }
        .message {
          max-width: 90%;
        }
      }

      @media (max-width: 900px) and (orientation: landscape) {
        .stage {
          aspect-ratio: 16 / 9;
          max-height: 70dvh;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 64 64">
              <path
                d="M16 22a6 6 0 0 1 6-6h14a6 6 0 0 1 6 6v4l10-6v24l-10-6v4a6 6 0 0 1-6 6H22a6 6 0 0 1-6-6z"
              />
            </svg>
          </div>
          <div>
            <h1>Papeo</h1>
            <p>Papo aleatório por vídeo</p>
          </div>
        </div>
        <div class="status" id="status" role="status" aria-live="polite">
          Desconectado
        </div>
      </header>

      <main class="layout">
        <section class="stage-col" aria-label="Videochamada">
          <div class="stage">
            <video id="remoteVideo" autoplay playsinline></video>
            <div class="tag">Estranho(a)</div>
            <div class="overlay" id="remoteOverlay">
              <div>
                <svg class="empty-icon" viewBox="0 0 64 64" aria-hidden="true">
                  <path
                    d="M16 22a6 6 0 0 1 6-6h14a6 6 0 0 1 6 6v4l10-6v24l-10-6v4a6 6 0 0 1-6 6H22a6 6 0 0 1-6-6z"
                  />
                </svg>
                <div class="spinner" aria-hidden="true"></div>
                <h2 id="overlayTitle">Pronto para um papo?</h2>
                <p id="overlayText">
                  Conecte-se, ligue a câmera e encontre alguém para conversar.
                </p>
              </div>
            </div>
            <div class="pip">
              <video id="localVideo" autoplay muted playsinline></video>
              <div class="tag">Você</div>
            </div>
          </div>

          <div class="controls">
            <button class="btn-primary" id="connectBtn" onclick="connect()">
              Conectar
            </button>
            <button
              class="btn-success"
              id="startBtn"
              onclick="startVideo()"
              disabled
            >
              Ligar câmera
            </button>
            <button
              class="btn-primary"
              id="findBtn"
              onclick="findMatch()"
              disabled
            >
              Buscar par
            </button>
            <button
              class="btn-danger"
              id="nextBtn"
              onclick="nextPerson()"
              disabled
            >
              Próximo
            </button>
            <button
              class="btn-danger"
              id="disconnectBtn"
              onclick="disconnect()"
              disabled
            >
              Sair
            </button>
          </div>
          <p class="hint" id="hint">Passo 1: toque em <b>Conectar</b>.</p>
        </section>

        <aside class="chat" aria-label="Chat">
          <div class="chat-header">
            Chat <small id="chatState">sem conversa</small>
          </div>
          <div class="chat-messages" id="chatMessages" aria-live="polite"></div>
          <form class="chat-input" id="chatForm" autocomplete="off">
            <input
              type="text"
              id="messageInput"
              placeholder="Digite uma mensagem..."
              maxlength="500"
              disabled
            />
            <button class="btn-primary" id="sendBtn" type="submit" disabled>
              Enviar
            </button>
          </form>
        </aside>
      </main>

      <footer class="info">
        <div>Seu ID: <span class="id" id="clientId">-</span></div>
        <div>Par: <span class="id" id="partnerId">-</span></div>
        <div>Conexão: <b id="connectionStatus">Desconectado</b></div>
      </footer>
    </div>

    <div class="toast" id="toast" role="alert"></div>

    <script>
      const $ = (id) => document.getElementById(id);

      let ws = null;
      let localStream = null;
      let peerConnection = null;
      let clientId = null;
      let partnerId = null;
      let isInitiator = false;
      let pendingCandidates = [];
      let signalQueue = Promise.resolve(); // processa sinalização em ordem
      let toastTimer = null;

      const config = {
        iceServers: [
          { urls: "stun:stun.l.google.com:19302" },
          { urls: "stun:stun1.l.google.com:19302" },
          {
            urls: "turn:openrelay.metered.ca:80",
            username: "openrelayproject",
            credential: "openrelayproject",
          },
          {
            urls: "turn:openrelay.metered.ca:443",
            username: "openrelayproject",
            credential: "openrelayproject",
          },
          {
            urls: "turn:openrelay.metered.ca:443?transport=tcp",
            username: "openrelayproject",
            credential: "openrelayproject",
          },
        ],
        iceCandidatePoolSize: 10,
      };

      /* ---------- UI helpers ---------- */
      function updateStatus(message, className = "") {
        const el = $("status");
        el.textContent = message;
        el.className = "status " + className;
      }

      function updateInfo(field, value) {
        $(field).textContent = value || "-";
      }

      function shortId(id) {
        return id ? id.slice(0, 8) : "-";
      }

      function showToast(message) {
        const t = $("toast");
        t.textContent = message;
        t.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove("show"), 4500);
      }

      function setHint(html) {
        $("hint").innerHTML = html;
      }

      function setOverlay(mode, title, text) {
        const o = $("remoteOverlay");
        o.classList.toggle("hidden", mode === "hidden");
        o.classList.toggle("searching", mode === "searching");
        if (title) $("overlayTitle").textContent = title;
        if (text !== undefined) $("overlayText").textContent = text;
      }

      function setChatEnabled(on) {
        $("messageInput").disabled = !on;
        $("sendBtn").disabled = !on;
        $("chatState").textContent = on ? "conversando" : "sem conversa";
        if (on && window.matchMedia("(hover: hover)").matches) {
          $("messageInput").focus();
        }
      }

      /* ---------- Conexão ---------- */
      async function getSessionToken() {
        const response = await fetch("/session/new");
        if (!response.ok) throw new Error("Falha ao obter sessão");
        return (await response.json()).token;
      }

      async function connect() {
        if (ws) return;
        $("connectBtn").disabled = true;
        try {
          updateStatus("Conectando...", "matching");
          const token = await getSessionToken();
          const proto = location.protocol === "https:" ? "wss" : "ws";
          const socket = new WebSocket(
            `${proto}://${location.host}/ws?token=${encodeURIComponent(token)}`
          );
          ws = socket;

          socket.onopen = () => {
            updateStatus("Conectado ao servidor", "connected");
            updateInfo("connectionStatus", "Conectado");
            $("startBtn").disabled = !!localStream;
            $("findBtn").disabled = !localStream;
            $("disconnectBtn").disabled = false;
            setHint(
              localStream
                ? "Passo 3: toque em <b>Buscar par</b>."
                : "Passo 2: toque em <b>Ligar câmera</b>."
            );
          };

          socket.onmessage = (event) => {
            let msg;
            try {
              msg = JSON.parse(event.data);
            } catch (e) {
              return;
            }
            // Sinalização WebRTC é processada em ordem, uma por vez
            signalQueue = signalQueue
              .then(() => handleMessage(msg))
              .catch((err) => console.error("Erro ao tratar mensagem:", err));
          };

          socket.onclose = () => {
            if (ws !== socket) return; // já tratado por disconnect()
            ws = null;
            closePeer();
            updateInfo("connectionStatus", "Desconectado");
            resetUI();
            updateStatus("Conexão perdida", "error");
            showToast("A conexão com o servidor foi encerrada.");
          };

          socket.onerror = () => {
            if (ws === socket && socket.readyState !== WebSocket.OPEN) {
              ws = null;
              resetUI();
              updateStatus("Erro de conexão", "error");
              showToast("Não foi possível conectar ao servidor.");
            }
          };
        } catch (error) {
          console.error("Falha ao conectar:", error);
          ws = null;
          updateStatus("Falha ao conectar", "error");
          showToast("Não foi possível conectar. Tente novamente.");
          $("connectBtn").disabled = false;
        }
      }

      async function startVideo() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          showToast("Seu navegador não permite acesso à câmera (requer HTTPS).");
          return;
        }
        $("startBtn").disabled = true;
        try {
          localStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user" },
            audio: true,
          });
          $("localVideo").srcObject = localStream;
          updateStatus("Câmera ligada — pronto para buscar", "connected");
          $("findBtn").disabled = false;
          setHint("Passo 3: toque em <b>Buscar par</b>.");
        } catch (error) {
          console.error("Erro ao acessar mídia:", error);
          $("startBtn").disabled = false;
          const denied = error && error.name === "NotAllowedError";
          showToast(
            denied
              ? "Permissão de câmera/microfone negada. Libere nas configurações do navegador."
              : "Não foi possível acessar câmera/microfone."
          );
        }
      }

      function findMatch() {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
          showToast("Você não está conectado ao servidor.");
          return;
        }
        send({ op: "join_queue" });
        updateStatus("Procurando alguém...", "matching");
        setOverlay(
          "searching",
          "Procurando alguém...",
          "Isso pode levar alguns instantes. Fique por aqui!"
        );
        setHint("Aguardando outra pessoa entrar na fila.");
        $("findBtn").disabled = true;
      }

      function nextPerson() {
        closePeer();
        $("remoteVideo").srcObject = null;
        send({ op: "next" });
        partnerId = null;
        isInitiator = false;
        updateInfo("partnerId", "-");
        clearChat();
        setChatEnabled(false);
        $("nextBtn").disabled = true;
        updateStatus("Procurando a próxima pessoa...", "matching");
        setOverlay("searching", "Procurando a próxima pessoa...", "");
        setTimeout(findMatch, 400);
      }

      function disconnect() {
        const socket = ws;
        ws = null;
        closePeer();
        if (socket) socket.close();
        resetUI();
        updateStatus("Desconectado", "");
        updateInfo("connectionStatus", "Desconectado");
      }

      function closePeer() {
        if (peerConnection) {
          peerConnection.onicecandidate = null;
          peerConnection.ontrack = null;
          peerConnection.onconnectionstatechange = null;
          peerConnection.close();
          peerConnection = null;
        }
        pendingCandidates = [];
      }

      function resetUI() {
        $("connectBtn").disabled = false;
        $("startBtn").disabled = true;
        $("findBtn").disabled = true;
        $("nextBtn").disabled = true;
        $("disconnectBtn").disabled = true;
        setChatEnabled(false);
        $("localVideo").srcObject = null;
        $("remoteVideo").srcObject = null;
        if (localStream) {
          localStream.getTracks().forEach((t) => t.stop());
          localStream = null;
        }
        clientId = null;
        partnerId = null;
        isInitiator = false;
        updateInfo("clientId", "-");
        updateInfo("partnerId", "-");
        clearChat();
        setOverlay(
          "idle",
          "Pronto para um papo?",
          "Conecte-se, ligue a câmera e encontre alguém para conversar."
        );
        setHint("Passo 1: toque em <b>Conectar</b>.");
      }

      /* ---------- Mensagens do servidor ---------- */
      async function handleMessage(msg) {
        switch (msg.op) {
          case "match_found":
            return handleMatchFound(msg);
          case "webrtc_offer":
            return handleWebRTCOffer(msg);
          case "webrtc_answer":
            return handleWebRTCAnswer(msg);
          case "ice_candidate":
            return handleICECandidate(msg);
          case "chat":
            return addMessage(msg.message, "received");
          case "partner_disconnected":
            return handlePartnerDisconnect();
          default:
            if (msg.client_id) {
              clientId = msg.client_id;
              updateInfo("clientId", shortId(clientId));
            }
        }
      }

      async function handleMatchFound(msg) {
        closePeer();
        partnerId = msg.partner;
        updateInfo("partnerId", shortId(partnerId));
        updateStatus("Par encontrado! Conectando...", "matched");
        setOverlay("searching", "Par encontrado!", "Estabelecendo conexão...");
        setHint("Dica: seja gentil e divirta-se!");

        $("nextBtn").disabled = false;
        setChatEnabled(true);
        clearChat(true);

        isInitiator = msg.should_call === true;

        if (isInitiator) {
          await createPeerConnection();
          const offer = await peerConnection.createOffer();
          await peerConnection.setLocalDescription(offer);
          send({ op: "webrtc_offer", data: { sdp: offer.sdp } });
        }
      }

      async function createPeerConnection() {
        const pc = new RTCPeerConnection(config);
        peerConnection = pc;

        if (localStream) {
          localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));
        }

        pc.ontrack = (event) => {
          const remoteVideo = $("remoteVideo");
          if (remoteVideo.srcObject !== event.streams[0]) {
            remoteVideo.srcObject = event.streams[0];
            setOverlay("hidden");
            updateStatus("Conectado! Bom papo", "matched");
          }
        };

        pc.onicecandidate = (event) => {
          if (event.candidate) {
            send({
              op: "ice_candidate",
              data: {
                candidate: {
                  candidate: event.candidate.candidate,
                  sdpMLineIndex: event.candidate.sdpMLineIndex,
                  sdpMid: event.candidate.sdpMid,
                },
              },
            });
          }
        };

        pc.onconnectionstatechange = () => {
          if (pc !== peerConnection) return;
          if (pc.connectionState === "failed") {
            showToast("A conexão de vídeo falhou. Tentando outro par...");
            nextPerson();
          } else if (pc.connectionState === "disconnected") {
            updateStatus("Conexão instável...", "matching");
          }
        };
      }

      async function flushCandidates() {
        const list = pendingCandidates;
        pendingCandidates = [];
        for (const c of list) {
          try {
            await peerConnection.addIceCandidate(c);
          } catch (e) {
            console.warn("Candidato ICE ignorado:", e);
          }
        }
      }

      async function handleWebRTCOffer(msg) {
        if (isInitiator) return;
        if (!peerConnection) await createPeerConnection();
        const pc = peerConnection;
        await pc.setRemoteDescription({ type: "offer", sdp: msg.data.sdp });
        await flushCandidates();
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        send({ op: "webrtc_answer", data: { sdp: answer.sdp } });
      }

      async function handleWebRTCAnswer(msg) {
        if (!isInitiator || !peerConnection) return;
        if (peerConnection.signalingState !== "have-local-offer") return;
        await peerConnection.setRemoteDescription({
          type: "answer",
          sdp: msg.data.sdp,
        });
        await flushCandidates();
      }

      async function handleICECandidate(msg) {
        const c = msg.data && msg.data.candidate;
        if (!c) return;
        const candidate = {
          candidate: c.candidate,
          sdpMLineIndex: c.sdpMLineIndex,
          sdpMid: c.sdpMid,
        };
        // Candidatos que chegam antes da descrição remota ficam em buffer
        if (!peerConnection || !peerConnection.remoteDescription) {
          pendingCandidates.push(candidate);
          return;
        }
        try {
          await peerConnection.addIceCandidate(candidate);
        } catch (e) {
          console.warn("Candidato ICE ignorado:", e);
        }
      }

      function handlePartnerDisconnect() {
        closePeer();
        $("remoteVideo").srcObject = null;
        partnerId = null;
        isInitiator = false;
        updateInfo("partnerId", "-");
        clearChat();
        setChatEnabled(false);
        $("nextBtn").disabled = true;
        updateStatus("O par saiu — buscando outro...", "matching");
        setOverlay("searching", "O par saiu", "Buscando outra pessoa...");

        setTimeout(() => {
          if (ws && ws.readyState === WebSocket.OPEN && localStream) {
            findMatch();
          } else {
            setOverlay("idle", "O par saiu", "Ligue a câmera e busque de novo.");
          }
        }, 800);
      }

      /* ---------- Chat ---------- */
      $("chatForm").addEventListener("submit", (e) => {
        e.preventDefault();
        sendMessage();
      });

      function sendMessage() {
        const input = $("messageInput");
        const message = input.value.trim();
        if (!message || input.disabled) return;
        send({ op: "chat", data: { message } });
        addMessage(message, "sent");
        input.value = "";
      }

      function addMessage(text, type) {
        const box = $("chatMessages");
        const empty = box.querySelector(".chat-empty");
        if (empty) empty.remove();

        const div = document.createElement("div");
        div.className = "message " + type;
        const body = document.createElement("div");
        body.textContent = text;
        const time = document.createElement("div");
        time.className = "message-time";
        time.textContent = new Date().toLocaleTimeString("pt-BR", {
          hour: "2-digit",
          minute: "2-digit",
        });
        div.append(body, time);
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
      }

      function clearChat(matched = false) {
        const box = $("chatMessages");
        box.innerHTML = "";
        const empty = document.createElement("div");
        empty.className = "chat-empty";
        empty.textContent = matched
          ? "Diga olá! 👋"
          : "Encontre um par para começar a conversar.";
        box.appendChild(empty);
      }

      function send(data) {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify(data));
        }
      }

      clearChat();
    </script>
  </body>
</html>
